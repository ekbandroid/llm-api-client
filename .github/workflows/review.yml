# Ревью изменений: diff плюс выдержки из документации и кода проекта.
#
# Два повода запуска, и второй нужен ради проверяемости. В этом репозитории
# коммиты идут прямо в master, PR'ов не бывает вовсе — значит, без
# workflow_dispatch пайплайн нельзя было бы ни разу увидеть работающим.
#
# gh здесь не нужен: actions/checkout с fetch-depth 0 даёт обе стороны, и diff
# берётся обычным git diff. Для чтения репозитория токен тоже не нужен —
# только для того, чтобы написать комментарий.
name: Ревью изменений

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Нужно только чтобы оставить комментарий. GITHUB_TOKEN выдаётся Action'у
  # сам, отдельного секрета для этого не требуется.
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Вся история: без неё origin/<база> недоступен и diff не собрать.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Ключа нет — не падаем, а громко предупреждаем и выходим. Падение здесь
      # означало бы красный крест на каждом PR из чужой копии репозитория:
      # таким PR секреты не выдаются по устройству GitHub, и это не их вина.
      # Идентификаторы здесь только латиницей: id шага и имена выходов
      # GitHub разбирает как имена, а не как текст, и кириллица в них
      # ломает весь файл — в списке заданий вместо имени появляется путь
      # к нему, и каждый прогон падает. Русский остаётся в name и в
      # сообщениях. Та же ловушка, что с именами переменных в sh.
      - name: Проверить ключ
        id: key
        env:
          CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}
        run: |
          if [ -z "$CLOUD_API_KEY" ]; then
            echo "::warning::Секрет CLOUD_API_KEY не задан — ревью пропущено. Добавьте его в настройках репозитория."
            echo "Ревью пропущено: секрет \`CLOUD_API_KEY\` не задан." >> "$GITHUB_STEP_SUMMARY"
            echo "present=no" >> "$GITHUB_OUTPUT"
          else
            echo "present=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Поставить зависимости
        if: steps.key.outputs.present == 'yes'
        run: pip install -r requirements.txt

      # Модель эмбеддингов качается из HuggingFace: в репозиторий она не
      # положена (357 МБ, models/ в .gitignore). Кэш по имени модели, а не по
      # requirements.txt: меняется она отдельно от зависимостей.
      - name: Кэш модели эмбеддингов
        if: steps.key.outputs.present == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-potion-multilingual-128M

      # Индекс собирается здесь же: rag.db в репозиторий не попадает (*.db в
      # .gitignore). Около 9 с по замеру дня 31 плюс загрузка модели.
      # Пользователь с номером 1 — условность: наборы живут в rag.db и о
      # переписке ничего не знают, app.db для этого не нужна.
      - name: Собрать индекс проекта
        if: steps.key.outputs.present == 'yes'
        env:
          RAG_DB_PATH: ${{ github.workspace }}/rag.db
          RAG_SOURCES_DIR: ${{ github.workspace }}/rag-sources
        run: |
          python -c "
          import codebase
          отчёт = codebase.build_collections(1)
          for набор in отчёт['collections']:
              print(f\"{набор['title']}: файлов {набор['files']}, кусков {набор['chunks']}, {набор['seconds']} с\")
          "

      - name: Ревью
        if: steps.key.outputs.present == 'yes'
        env:
          LLM_PROVIDER: cloud
          CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}
          RAG_DB_PATH: ${{ github.workspace }}/rag.db
          RAG_SOURCES_DIR: ${{ github.workspace }}/rag-sources
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
              python review.py --range "origin/${{ github.base_ref }}...HEAD" | tee review.md
          else
              python review.py --commit HEAD | tee review.md
          fi

      - name: В сводку сборки
        if: steps.key.outputs.present == 'yes'
        run: cat review.md >> "$GITHUB_STEP_SUMMARY"

      # Комментарий обновляется, а не плодится: ищем свой прежний по скрытой
      # метке в теле. Иначе каждый push в ветку добавлял бы ещё один, и к
      # пятому обсуждение читать было бы нечем.
      - name: Комментарий в PR
        if: steps.key.outputs.present == 'yes' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const МЕТКА = '<!-- ai-review -->';
            const тело = МЕТКА + '\n## Ревью изменений\n\n' +
                         fs.readFileSync('review.md', 'utf8');
            const {owner, repo} = context.repo;
            const number = context.issue.number;
            const есть = await github.paginate(
                github.rest.issues.listComments, {owner, repo, issue_number: number});
            const свой = есть.find(c => (c.body || '').includes(МЕТКА));
            if (свой) {
                await github.rest.issues.updateComment(
                    {owner, repo, comment_id: свой.id, body: тело});
            } else {
                await github.rest.issues.createComment(
                    {owner, repo, issue_number: number, body: тело});
            }
